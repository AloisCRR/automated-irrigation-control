<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project presentation | Alois Carrera</title>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-menu-title="Presentación"
          data-background-image="./src/images/intro-bg.jpg"
          data-background-opacity="0.4"
        >
          <div class="center">
            <h3 class="tracking-widest font-semibold">
              Sistema de control de agua basado en IoT
            </h3>
            <p class="font-light">
              Alois Carrera | Universidad Tecnológica de Panamá
            </p>
            <div>
              <img
                class="logo"
                src="https://utp.ac.pa/documentos/2015/imagen/logo_utp_1_300.png"
                alt="UTP Logo"
              />
              <img
                class="logo"
                src="https://fisc.utp.ac.pa/sites/fisc.utp.ac.pa/files/documentos/2020/imagen/logo_en_contactenos.png"
                alt="FISC UTP Logo"
              />
              <img
                class="logo"
                src="src/images/robotsis.png"
                alt="ROBOTSIS UTP Logo"
              />
            </div>
          </div>
        </section>
        <section>
          <h5 class="absolute left-0 right-0 top-0 heading p-10 bg-green-600">
            Contenido
          </h5>
          <div
            class="h-screen flex justify-center items-center max-w-7xl mx-auto"
          >
            <div class="w-full">
              <div class="flex justify-between">
                <div class="content-item">
                  <span class="number">1</span><span>Objetivos</span>
                </div>
                <div class="content-item">
                  <span class="number">2</span><span>Metodología</span>
                </div>
                <div class="content-item">
                  <span class="number">3</span
                  ><span>Análisis del problema</span>
                </div>
                <div class="content-item">
                  <span class="number">4</span><span>Tecnología utilizada</span>
                </div>
              </div>
              <div class="flex justify-evenly mt-20">
                <div class="content-item">
                  <span class="number">5</span><span>Diseño</span>
                </div>
                <div class="content-item">
                  <span class="number">6</span><span>Resultados</span>
                </div>
                <div class="content-item">
                  <span class="number">7</span><span>Conclusiones</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
